# WHY: the Pi host compatibility matrix stays in CI (not a local hook) because
# it installs unlocked host releases; the other checks run in local git hooks.
# Public contributions need reproducible checks without any publication
# authority; every action is pinned to a reviewed full commit SHA.
name: compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Keep the locked baseline and each supported current host independently
  # verifiable. WHY a matrix: a new host minor can break at import time, so
  # the previous minor stays covered while the newest one is added.
  compatibility-host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pi-version: ["1.1.0", "1.2.0"]
    name: compatibility (Pi ${{ matrix.pi-version }})
    env:
      PI_VERSION: ${{ matrix.pi-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      # The candidate host must not rewrite the oldest-supported lockfile.
      # WHY every sibling: the host declares its own packages with caret
      # ranges, so a newer sibling release can break the pinned host at import
      # time; pinning all of them to the host version tests the host as it
      # was released. chord is a 1.1.0 dependency; it is harmless elsewhere.
      - run: npm install --no-save --package-lock=false --ignore-scripts @earendil-works/pi-coding-agent@"$PI_VERSION" @earendil-works/pi-tui@"$PI_VERSION" @earendil-works/pi-codemode@"$PI_VERSION" @earendil-works/pi-ai@"$PI_VERSION" @earendil-works/pi-agent-core@"$PI_VERSION" @earendil-works/pi-mcp@"$PI_VERSION" @earendil-works/chord@"$PI_VERSION"
      - run: npm run typecheck
      - run: npm test

  # WHY: branch protection requires one check named "compatibility"; matrix
  # jobs report per-host names, so this gate passes only if every host passed.
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: compatibility-host
    if: always()
    steps:
      - run: test "$HOST_RESULT" = "success"
        env:
          HOST_RESULT: ${{ needs.compatibility-host.result }}
