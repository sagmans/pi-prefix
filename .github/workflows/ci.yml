# WHY: public contributions need reproducible checks without any publication
# authority; every action is pinned to a reviewed full commit SHA.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      # WHY: no dependency in the tree needs lifecycle scripts, so blocking
      # them removes a whole class of supply-chain install-time code.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm pack --dry-run

  # Keep the locked baseline and the current host independently verifiable.
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PI_VERSION: "1.1.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      # The candidate host must not rewrite the oldest-supported lockfile.
      # WHY pi-codemode: the host declares it with a caret range, so a newer
      # sibling release can break the pinned host at import time; pinning it
      # to the host version tests the host as it was released.
      - run: npm install --no-save --package-lock=false --ignore-scripts @earendil-works/pi-coding-agent@"$PI_VERSION" @earendil-works/pi-tui@"$PI_VERSION" @earendil-works/pi-codemode@"$PI_VERSION"
      - run: npm run typecheck
      - run: npm test
