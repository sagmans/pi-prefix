# Dependabot policy. The supply chain window lives in .npmrc (min-release-age),
# so the npm cooldown below mirrors it: a bot pull request and `npm install`
# should never disagree about which release is old enough to use.
version: 2
updates:
  # Every action is pinned by full commit SHA, and nothing else raises those pins.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # The dev lockfile tracks the current Pi host (^1.4.0). The pre-push
  # compatibility matrix tests Pi 0.84.4, 1.1.0 and 1.2.0 from their own
  # committed lockfiles in compat/, so a root Pi update retires no tested
  # baseline and proposals inside the host line stay routine.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      # Pi 2.0.0 and later are outside the supported host line: the peer range
      # ends below 2.0.0, and adopting a new major also moves the peer range
      # and the compatibility matrix, so it stays a deliberate decision. A
      # versions rule binds security updates too, so no proposal can reach
      # them; updates inside the host line, advisory fixes included, still
      # open a pull request.
      - dependency-name: "@earendil-works/*"
        versions: [">=2.0.0"]
    groups:
      # pi-coding-agent depends on pi-tui, and this repo also depends on it
      # directly. Separate proposals resolve two pi-tui copies, so typecheck
      # sees two distinct TUI types and fails; one group keeps them in lockstep.
      pi:
        patterns: ["@earendil-works/*"]
      # A group applies to version updates only unless it says otherwise, so an
      # advisory fix for one Pi package would split the pair again.
      pi-security:
        applies-to: "security-updates"
        patterns: ["@earendil-works/*"]
      # One pull request for the routine toolchain bumps keeps review attention
      # on majors and on the Pi baseline.
      dev-toolchain:
        dependency-type: "development"
        patterns: ["*"]
        exclude-patterns: ["@earendil-works/*"]
        update-types: ["minor", "patch"]
