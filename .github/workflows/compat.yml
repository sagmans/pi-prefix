# WHY: the Pi host compatibility matrix stays in CI (not a local hook) because
# it installs unlocked host releases; the other checks run in local git hooks.
# Runs only on pushes to main: work lands trunk-based, so there is no PR stage
# to gate. No publication authority; every action is pinned to a reviewed full
# commit SHA.
name: compatibility

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Keep each supported host independently verifiable. The lockfile tracks the
  # newest host (dev range ^1.4.0), so the matrix covers the older hosts the
  # peer range still promises. WHY a matrix: a new host minor can break at
  # import time, so earlier hosts stay covered while the newest one is locked.
  compatibility-host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # WHY: 0.84.4 is the peer-range floor; the dev lockfile no longer
          # tests it. It predates the codemode, mcp and chord packages.
          - pi-version: "0.84.4"
            packages: "pi-coding-agent pi-tui pi-ai pi-agent-core"
          - pi-version: "1.1.0"
            packages: "pi-coding-agent pi-tui pi-codemode pi-ai pi-agent-core pi-mcp chord"
          - pi-version: "1.2.0"
            packages: "pi-coding-agent pi-tui pi-codemode pi-ai pi-agent-core pi-mcp chord"
    name: compatibility (Pi ${{ matrix.pi-version }})
    env:
      PI_VERSION: ${{ matrix.pi-version }}
      PI_PACKAGES: ${{ matrix.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # WHY exact: a floating line resolves from the runner toolcache and
          # can lag a security release. Move it with publish.yml on each Node
          # 24 security fix.
          node-version: "24.22.1"
          cache: npm
      - run: npm ci --ignore-scripts
      # The candidate host must not rewrite the committed lockfile.
      # WHY every sibling: the host declares its own packages with caret
      # ranges, so a newer sibling release can break the pinned host at import
      # time; pinning all of them to the host version tests the host as it
      # was released. chord is a 1.1.0 dependency; it is harmless elsewhere.
      - run: |
          specs=()
          for pkg in $PI_PACKAGES; do specs+=("@earendil-works/${pkg}@${PI_VERSION}"); done
          npm install --no-save --package-lock=false --ignore-scripts "${specs[@]}"
      - run: npm run typecheck
      - run: npm test

  # WHY: branch protection requires one check named "compatibility"; matrix
  # jobs report per-host names, so this gate passes only if every host passed.
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: compatibility-host
    if: always()
    steps:
      - run: test "$HOST_RESULT" = "success"
        env:
          HOST_RESULT: ${{ needs.compatibility-host.result }}
