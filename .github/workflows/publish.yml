# WHY: recurring releases publish the verified tag artifact through npm
# trusted publishing; no long-lived tokens. First publication additionally
# needs the npmjs trusted-publisher entry for this repo (owner action, once).
name: publish

on:
  push:
    tags: ["v*"]
  # WHY: manual probe path; re-running a tag build reuses its ref, so
  # validating a workflow fix needs a dispatchable entry point.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          # WHY: OIDC registry-token exchange needs npm >=11.15; Node 24
          # bundles it, Node 22 does not.
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      # WHY: no dependency in the tree needs lifecycle scripts, so blocking
      # them removes a whole class of supply-chain install-time code.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm pack --dry-run
      - run: npm publish --provenance --access public
